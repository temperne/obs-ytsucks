name: Unit Tests
run-name: ${{ github.ref_name }} unit tests 🧪
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tests --config Release
      - name: Test
        run: ctest --test-dir build-tests -C Release --output-on-failure

  e2e-linux:
    name: End-to-end (headless OBS, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libobs-dev obs-studio \
            libtesseract-dev tesseract-ocr-eng xvfb libgl1-mesa-dri imagemagick libx11-dev
      - name: Build plugin
        run: |
          cmake -S . -B build-e2e -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-e2e
      - name: Run end-to-end test
        run: tests/e2e/run-e2e.sh build-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: build-e2e/e2e-output.png
